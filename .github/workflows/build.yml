name: Build all Minecraft releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and validate Minecraft mixins
        run: bash ./gradlew build mixinSmoke -Pminecraft_version=${{ matrix.minecraft }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error


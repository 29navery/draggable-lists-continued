buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath "net.fabricmc:fabric-loom:${loom_version}" }
}
apply plugin: minecraft_version.startsWith("1.") ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom"

def targets = new groovy.json.JsonSlurper().parse(file("versions.json"))
def target = targets[minecraft_version]
if (target == null) throw new GradleException("Unsupported Minecraft version: ${minecraft_version}")
version = "${mod_version}+mc${minecraft_version}"
group = "com.mrmelon54.DraggableLists"
base { archivesName = "draggable-lists-continued" }
layout.buildDirectory = file("build/${minecraft_version}")

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    accessWidenerPath = file(minecraft_version.startsWith("1.") ? "common/src/main/resources/draggable_lists.accesswidener" : "versions/modern/draggable_lists.accesswidener")
}

sourceSets.main {
    java.srcDirs = [layout.buildDirectory.dir("generated/java")]
    resources.srcDirs = ["common/src/main/resources", "fabric/src/main/resources"]
    resources.exclude "architectury.common.json"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (minecraft_version.startsWith("1.")) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "me.shedaniel.cloth:cloth-config-fabric:${target.cloth}"
        modCompileOnly "com.terraformersmc:modmenu:${target.modmenu}"
        modRuntimeOnly "com.terraformersmc:modmenu:${target.modmenu}"
    } else {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "me.shedaniel.cloth:cloth-config-fabric:${target.cloth}"
        compileOnly "com.terraformersmc:modmenu:${target.modmenu}"
        runtimeOnly "com.terraformersmc:modmenu:${target.modmenu}"
    }
}

processResources {
    inputs.properties(version: version, minecraft_version: minecraft_version, java_version: target.java, cloth_version: target.cloth)
    filesMatching("fabric.mod.json") {
        expand(version: version, minecraft_version: minecraft_version, java_version: target.java, cloth_version: target.cloth)
    }
    filesMatching("draggable_lists-common.mixins.json") { expand(java_version: target.java) }
    filesMatching("draggable_lists.accesswidener") { if (!minecraft_version.startsWith("1.")) filter { it.replace("v2  named", "v2  official") } }
}
tasks.withType(JavaCompile).configureEach { options.release = target.java as int; options.encoding = "UTF-8" }
java { withSourcesJar() }
jar { from("LICENSE.md") }

// The game renamed its render API in 26.1. Keep one source implementation.
 tasks.register("generateVersionSources", Sync) {
    from("common/src/main/java", "fabric-like/src/main/java", "fabric/src/main/java")
    exclude "**/PackSelectionModelMixin.java", "**/ResourcePackOrganizerDuckProvider.java"
    into(layout.buildDirectory.dir("generated/java"))
    inputs.property("minecraft_version", minecraft_version)
    inputs.file(buildFile)
    filter { String line ->
        if (minecraft_version.startsWith("1.")) {
            line = line.replace("GuiGraphicsExtractor", "GuiGraphics")
                       .replace("extractListItems", "renderListItems")
                       .replace("extractItem", "renderItem")
                       .replace("extractWidgetRenderState", "renderWidget")
                       .replace("extractContent", "renderContent")
        }
        if (minecraft_version in ["1.21.9", "1.21.10"]) {
            line = line.replace("Identifier", "ResourceLocation").replace("me.shedaniel.autoconfig.AutoConfigClient.getConfigScreen", "AutoConfig.getConfigScreen")
        }
        if (minecraft_version != "26.3") {
            line = line.replace("com.mojang.renderpearl.api.pipeline", "com.mojang.blaze3d.pipeline")
                       .replace("com/mojang/renderpearl/api/pipeline", "com/mojang/blaze3d/pipeline")
                       .replace("InputConstants.isKeyDown(InputConstants.", "InputConstants.isKeyDown(Minecraft.getInstance().getWindow(), InputConstants.")
        }
        line
    }
 }
 compileJava.dependsOn(generateVersionSources)
 sourcesJar.dependsOn(generateVersionSources)

configurations { mixinSmoke }
dependencies {
    mixinSmoke("net.minecraft:launchwrapper:1.12") { transitive = false }
    ["asm", "asm-tree", "asm-commons", "asm-util", "asm-analysis"].each { mixinSmoke "org.ow2.asm:${it}:9.9.1" }
}
tasks.register("compileMixinSmoke", JavaCompile) {
    source = fileTree("tools") { include "MixinSmoke.java" }
    classpath = sourceSets.main.runtimeClasspath + configurations.mixinSmoke
    destinationDirectory = layout.buildDirectory.dir("smoke")
    options.release = 25
    dependsOn(classes)
}
tasks.register("mixinSmoke", JavaExec) {
    dependsOn(compileMixinSmoke)
    classpath = sourceSets.main.runtimeClasspath.filter { it.name.contains("sponge-mixin") } + configurations.mixinSmoke + files(layout.buildDirectory.dir("smoke")) + sourceSets.main.runtimeClasspath
    mainClass = "MixinSmoke"
}
